<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时间戳转换工具 | Atokia Toolbox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');

    body { font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen text-gray-900">
<nav class="bg-white shadow-sm sticky top-0 z-50">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    <a href="/" class="flex items-center space-x-2 text-gray-900 hover:text-gray-600 transition">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      <span class="font-semibold">返回首页</span>
    </a>
    <h1 class="text-xl sm:text-2xl font-bold">时间戳转换</h1>
    <div class="w-24"></div>
  </div>
</nav>

<main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
  <section class="bg-white rounded-xl shadow-md p-6">
    <h2 class="text-lg font-semibold mb-4">当前时间</h2>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="rounded-lg bg-slate-50 p-4"><p class="text-sm text-gray-500">秒级时间戳</p><p id="nowSeconds" class="mono text-lg mt-1">-</p></div>
      <div class="rounded-lg bg-slate-50 p-4"><p class="text-sm text-gray-500">毫秒级时间戳</p><p id="nowMillis" class="mono text-lg mt-1">-</p></div>
      <div class="rounded-lg bg-slate-50 p-4"><p class="text-sm text-gray-500">本地时间</p><p id="nowLocal" class="mono text-sm mt-1 break-all">-</p></div>
    </div>
  </section>

  <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <div class="bg-white rounded-xl shadow-md p-6 space-y-4">
      <h2 class="text-lg font-semibold">时间戳 → 日期时间</h2>
      <input id="timestampInput" class="w-full border rounded-lg px-3 py-2 mono" placeholder="输入 10 位(秒)或 13 位(毫秒)时间戳">
      <div class="flex items-center gap-3">
        <button id="convertTsBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg">转换</button>
        <button id="useNowBtn" class="bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-lg">使用当前</button>
      </div>
      <div id="tsResult" class="rounded-lg bg-slate-50 p-4 text-sm text-gray-700 whitespace-pre-wrap">转换结果将显示在这里</div>
    </div>

    <div class="bg-white rounded-xl shadow-md p-6 space-y-4">
      <h2 class="text-lg font-semibold">日期时间 → 时间戳</h2>
      <input id="datetimeInput" type="datetime-local" class="w-full border rounded-lg px-3 py-2">
      <div class="flex items-center gap-3">
        <button id="convertDateBtn" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg">转换</button>
        <button id="fillNowBtn" class="bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-lg">填入当前</button>
      </div>
      <div id="dateResult" class="rounded-lg bg-slate-50 p-4 text-sm text-gray-700 whitespace-pre-wrap">转换结果将显示在这里</div>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
