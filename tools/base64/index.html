<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base64 编解码 | Atokia Toolbox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');
    body { font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen text-gray-900">
<nav class="bg-white shadow-sm sticky top-0 z-50">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    <a href="/" class="flex items-center space-x-2 text-gray-900 hover:text-gray-600 transition">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      <span class="font-semibold">返回首页</span>
    </a>
    <h1 class="text-xl sm:text-2xl font-bold">Base64 编解码</h1>
    <div class="w-24"></div>
  </div>
</nav>

<main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <section class="bg-white rounded-xl shadow-md p-6 space-y-4">
    <h2 class="text-lg font-semibold">文本与 Base64 互转</h2>
    <textarea id="inputText" class="w-full h-36 border rounded-lg px-3 py-2 mono" placeholder="输入原始文本或 Base64 内容"></textarea>
    <div class="flex flex-wrap gap-3">
      <button id="encodeBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg">编码为 Base64</button>
      <button id="decodeBtn" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg">解码为文本</button>
      <button id="swapBtn" class="bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-lg">结果回填到输入</button>
      <button id="clearBtn" class="bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-lg">清空</button>
    </div>
    <textarea id="outputText" class="w-full h-36 border rounded-lg px-3 py-2 mono" placeholder="结果将显示在这里" readonly></textarea>
    <p id="message" class="text-sm text-gray-500"></p>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
