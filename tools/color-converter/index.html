<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>颜色转换工具 | Atokia Toolbox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');

    body { font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen text-gray-900">
<nav class="bg-white shadow-sm sticky top-0 z-50">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    <a href="/" class="flex items-center space-x-2 text-gray-900 hover:text-gray-600 transition">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      <span class="font-semibold">返回首页</span>
    </a>
    <h1 class="text-xl sm:text-2xl font-bold">颜色转换</h1>
    <div class="w-24"></div>
  </div>
</nav>

<main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
  <section class="bg-white rounded-xl shadow-md p-6 space-y-4">
    <h2 class="text-lg font-semibold">输入颜色</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label for="colorInput" class="block text-sm text-gray-600 mb-2">支持 HEX / RGB / HSL</label>
        <input id="colorInput" class="w-full border rounded-lg px-3 py-2 mono" placeholder="#3b82f6 或 rgb(59,130,246) 或 hsl(217,91%,60%)">
      </div>
      <div>
        <label for="colorPicker" class="block text-sm text-gray-600 mb-2">颜色选择器</label>
        <input id="colorPicker" type="color" class="w-full h-11 border rounded-lg px-1 py-1" value="#3b82f6">
      </div>
    </div>
    <div class="flex items-center gap-3">
      <button id="convertBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg">转换</button>
      <button id="resetBtn" class="bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-lg">重置</button>
    </div>
  </section>

  <section class="bg-white rounded-xl shadow-md p-6 space-y-4">
    <h2 class="text-lg font-semibold">转换结果</h2>
    <div id="preview" class="h-24 rounded-lg border"></div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
      <div class="rounded-lg bg-slate-50 p-4"><p class="text-gray-500 mb-1">HEX</p><p id="hexResult" class="mono break-all">-</p></div>
      <div class="rounded-lg bg-slate-50 p-4"><p class="text-gray-500 mb-1">RGB</p><p id="rgbResult" class="mono break-all">-</p></div>
      <div class="rounded-lg bg-slate-50 p-4"><p class="text-gray-500 mb-1">HSL</p><p id="hslResult" class="mono break-all">-</p></div>
    </div>
    <p id="errorText" class="text-sm text-red-500"></p>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
