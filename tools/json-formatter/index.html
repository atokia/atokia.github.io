<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 格式化工具 | Atokia Toolbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');
        
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        :root {
            --nav-height: 4rem;
        }

        .viewport-fit {
            min-height: calc(100dvh - var(--nav-height));
        }

        .editor-pane {
            min-height: 40dvh;
            max-height: calc(100dvh - var(--nav-height) - 18rem);
            overflow: auto;
        }

        @media (min-width: 1024px) {
            .editor-pane {
                min-height: 0;
            }
        }
        
        textarea, pre {
            font-family: 'JetBrains Mono', monospace;
        }
        
        .json-highlight {
            overflow-x: auto;
        }
        
        .json-string { color: #22c55e; }
        .json-number { color: #f59e0b; }
        .json-boolean { color: #ec4899; }
        .json-null { color: #6366f1; }
        .json-key { color: #3b82f6; }
        .json-bracket { color: #9ca3af; }

        .fullscreen-panel {
            position: fixed !important;
            inset: 0;
            z-index: 70;
            margin: 0 !important;
            border-radius: 0 !important;
            height: 100dvh !important;
        }

        .fullscreen-panel .editor-pane {
            max-height: none;
            min-height: 0;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen flex flex-col">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-2 text-gray-900 hover:text-gray-600 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                <span class="font-semibold">返回首页</span>
            </a>
            <h1 class="text-2xl font-bold text-gray-900">JSON 格式化</h1>
            <div class="w-32"></div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 lg:py-8 viewport-fit flex flex-col flex-1 min-h-0 overflow-y-auto">
        <!-- 工具容器 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 flex-1">
            <!-- 输入区 -->
            <div class="flex flex-col min-h-[45dvh] lg:min-h-0">
                <div id="inputPanel" class="bg-white rounded-lg shadow-md overflow-hidden flex flex-col h-full">
                    <div class="bg-gradient-to-r from-blue-500 to-blue-600 text-white px-6 py-4 flex items-center justify-between">
                        <h2 class="text-lg font-semibold">输入 JSON</h2>
                        <div class="flex items-center gap-2">
                            <button id="inputFullscreenBtn" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded text-sm transition">
                                全屏
                            </button>
                            <button id="pasteBtn" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded text-sm transition">
                                粘贴
                            </button>
                        </div>
                    </div>
                    
                    <textarea 
                        id="inputJson" 
                        class="editor-pane flex-1 p-6 focus:outline-none resize-none text-sm"
                        placeholder="在这里粘贴您的 JSON 数据...&#10;&#10;示例: {&#10;  &quot;name&quot;: &quot;John&quot;,&#10;  &quot;age&quot;: 30&#10;}"
                        spellcheck="false"
                    ></textarea>
                    
                    <div class="bg-gray-50 px-6 py-3 border-t flex items-center space-x-2">
                        <span class="text-sm text-gray-600" id="inputSize">0 字节</span>
                    </div>
                </div>
            </div>

            <!-- 输出区 -->
            <div class="flex flex-col min-h-[45dvh] lg:min-h-0">
                <div id="outputPanel" class="bg-white rounded-lg shadow-md overflow-hidden flex flex-col h-full">
                    <div class="bg-gradient-to-r from-green-500 to-green-600 text-white px-6 py-4 flex items-center justify-between">
                        <h2 class="text-lg font-semibold">输出 JSON</h2>
                        <div class="flex items-center gap-2">
                            <button id="outputFullscreenBtn" class="bg-green-700 hover:bg-green-800 px-3 py-1 rounded text-sm transition">
                                全屏
                            </button>
                            <button id="copyBtn" class="bg-green-700 hover:bg-green-800 px-3 py-1 rounded text-sm transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                                复制
                            </button>
                        </div>
                    </div>
                    
                    <pre id="outputJson" class="editor-pane flex-1 p-6 bg-gray-900 text-gray-100 rounded-none text-sm whitespace-pre-wrap break-words">输出结果将显示在这里</pre>
                    
                    <div class="bg-gray-50 px-6 py-3 border-t flex items-center justify-between">
                        <span class="text-sm text-gray-600" id="outputSize">0 字节</span>
                        <span id="formatStatus" class="text-sm font-semibold text-gray-600"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 控制面板 -->
        <div class="mt-6 bg-white rounded-lg shadow-md p-6">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">工具选项</h3>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <button id="formatBtn" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded transition">
                    📐 格式化
                </button>
                <button id="minifyBtn" class="bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2 px-4 rounded transition">
                    🗜️ 压缩
                </button>
                <button id="validateBtn" class="bg-purple-500 hover:bg-purple-600 text-white font-semibold py-2 px-4 rounded transition">
                    ✓ 验证
                </button>
                <button id="clearBtn" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded transition">
                    🗑️ 清空
                </button>
            </div>
        </div>

        <!-- 信息面板 -->
        <div id="infoPanel" class="mt-6 bg-white rounded-lg shadow-md p-6 hidden">
            <div id="infoContent"></div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
